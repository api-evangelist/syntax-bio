name: Syntax Bio
description: >-
  Syntax Bio is a synthetic biology company programming the next generation of
  cell therapies. Its proprietary Cellgorithm platform uses a CRISPR-based
  system to program and accelerate stem cell differentiation, replacing slow,
  labor-intensive processes with a rapid, programmable approach that mimics
  human development to generate diverse functional cell types at scale. The
  company is advancing pancreatic beta cell therapy for type 1 diabetes and is
  backed by DCVC Bio, Astellas Venture Management, Illumina Ventures, and
  others. Added to the API Evangelist network as a portfolio company of dcvc;
  enrichment found no public API, developer portal, SDK, or programmatic
  developer surface as of this pass.
